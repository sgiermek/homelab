mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate

# No Coral detected on this host - CPU detection only for now.
# Migrate to a Coral USB (type: edgetpu) once you have one; CPU detection
# does not scale past ~1 low-fps camera.
detectors:
  cpu1:
    type: cpu
    num_threads: 2

detect:
  enabled: true
  width: 320
  height: 320
  fps: 5

# Disk on this host is tight (~35GB free) - only record around motion,
# short retention, and keep event clips a bit longer than continuous footage.
record:
  enabled: true
  alerts:
    retain:
      days: 5
  detections:
    retain:
      days: 5
  continuous:
    days: 0
  motion:
    days: 1
snapshots:
  enabled: true
  retain:
    default: 5

cameras:
  front_bok: # Hikvision DS-2CD2046G2-I - G67574112
    enabled: true
    ffmpeg:
      inputs:
        # Password comes from .env via FRIGATE_RTSP_PASSWORD - not hardcoded here.
        # Hikvision ISAPI paths: /Streaming/Channels/101 = main (full-res),
        # /Streaming/Channels/102 = sub (low-res). Splitting them keeps CPU
        # decode cost for detection low while recordings stay full quality.
        - path: rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.20.102:554/Streaming/Channels/102
          roles:
            - detect
        - path: rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.20.102:554/Streaming/Channels/101
          roles:
            - record
    detect:
      width: 320
      height: 320
      fps: 5
version: 0.17-0
