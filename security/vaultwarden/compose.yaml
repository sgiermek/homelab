services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    environment:
      - DOMAIN=https://vault.lan
      - SIGNUPS_ALLOWED=true
      - WEBSOCKET_ENABLED=true

    volumes:
      - ./data:/data

    networks:
      - homelab

    ports:
      - "8085:80"

networks:
  homelab:
    external: true
