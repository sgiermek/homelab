- id: '1771269738328'
  alias: Kotlownia - Monitor gryzoni
  triggers:
  - entity_id: binary_sensor.md_01_occupancy
    to: 'on'
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.md_01_illuminance
    below: 10
  - condition: template
    value_template: "{{ (as_timestamp(now()) -\n   as_timestamp(state_attr(this.entity_id,'last_triggered')
      | default(0))) > 30 }}\n"
  actions:
  - target:
      entity_id: counter.kotlownia_gryzonie
    action: counter.increment
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: counter.kotlownia_gryzonie
        above: 9
      sequence:
      - data:
          title: "\U0001F42D Mozliwa aktywnosc gryzoni"
          message: 'W kotlowni wykryto {{ states(''counter.kotlownia_gryzonie'') }}
            zdarzen ruchu w ciemnosci.

            '
        action: notify.mobile_app_pococ6
      - target:
          entity_id: counter.kotlownia_gryzonie
        action: counter.reset
  - delay: 01:00:00
  - target:
      entity_id: counter.kotlownia_gryzonie
    action: counter.reset
  mode: restart
