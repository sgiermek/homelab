- id: rekuperator_sterowanie_final
  alias: Rekuperator – smart v3 (bez błędów)
  triggers:
  - minutes: /5
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{% set last = state_attr(''automation.rekuperator_smart_v3'',
      ''last_triggered'') %} {{ last is none or (now() - last).total_seconds() > 600
      }}

      '
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_11_temperature
        below: 5
      - condition: template
        value_template: '{{ t_in < 19 }}'
      sequence:
      - target:
          entity_id: switch.switch_rekuperator
        action: switch.turn_off
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_11_temperature
        below: 5
      sequence:
      - target:
          entity_id: switch.switch_rekuperator
        action: switch.turn_on
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_11_temperature
        above: 10
      - condition: template
        value_template: '{{ t_out < t_in }}'
      sequence:
      - target:
          entity_id: switch.switch_rekuperator
        action: switch.turn_on
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_05_humidity
        above: 60
      sequence:
      - target:
          entity_id: switch.switch_rekuperator
        action: switch.turn_on
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_05_temperature
        above: 24
      sequence:
      - target:
          entity_id: switch.switch_rekuperator
        action: switch.turn_on
    default:
    - target:
        entity_id: switch.switch_rekuperator
      action: switch.turn_on
    - delay: 00:10:00
    - target:
        entity_id: switch.switch_rekuperator
      action: switch.turn_off
  variables:
    t_in: '{{ states(''sensor.th_05_temperature'') | float }}'
    t_out: '{{ states(''sensor.th_11_temperature'') | float }}'
    hum: '{{ states(''sensor.th_05_humidity'') | float }}'
  mode: restart
