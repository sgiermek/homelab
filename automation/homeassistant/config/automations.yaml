- id: '1771069583392'
  alias: Alert notify - elektryzer
  description: Alert jeśli elektryzer nie jest włączony lub nie odpowiada
  triggers:
  - event: sunset
    offset: -00:10:00
    trigger: sun
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: sswitch.switch_zb_10
      state: 'off'
    - condition: state
      entity_id: switch.switch_zb_10
      state: unavailable
    - condition: state
      entity_id: switch.switch_zb_10
      state: unknown
  actions:
  - data:
      title: ⚠️ HA – Elektryzer
      message: 'Elektryzer jest OFF lub nie odpowiada (20 minut przed zachodem słońca).

        '
      data:
        importance: high
        priority: high
        ttl: 0
    action: notify.mobile_app_pococ6
  mode: single
